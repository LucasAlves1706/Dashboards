<script>
(function(){
var P=JSON.parse(document.getElementById('pkg').textContent);
var enc=new TextEncoder();
function d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function kek(user,pass){
 var m=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+'\u0000'+pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.salt),iterations:P.it,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function gunzip(u8){var ds=new DecompressionStream('gzip');var w=ds.writable.getWriter();w.write(u8);w.close();return new Response(ds.readable).arrayBuffer()}
var f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
f.addEventListener('submit',async function(ev){
 ev.preventDefault();e.textContent='';b.disabled=true;b.textContent='Verificando...';
 try{
  if(!window.crypto||!crypto.subtle)throw new Error('nosec');
  var k=await kek(document.getElementById('u').value,document.getElementById('p').value),raw=null;
  for(var i=0;i<P.slots.length&&!raw;i++){
   try{raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.slots[i].iv)},k,d(P.slots[i].w))}catch(x){}
  }
  if(!raw){await new Promise(function(r){setTimeout(r,1200)});throw new Error('bad')}
  var dek=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.iv)},dek,d(P.ct));
  var html=new TextDecoder().decode(await gunzip(new Uint8Array(gz)));
  document.body.style.cssText='margin:0;background:#fff;display:block';
  document.body.innerHTML='';
  var fr=document.createElement('iframe');
  fr.setAttribute('allow','fullscreen');fr.setAttribute('allowfullscreen','');
  fr.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';
  fr.onload=function(){try{fr.contentWindow.focus()}catch(x){}};
  fr.srcdoc=html;document.body.appendChild(fr);
 }catch(x){
  e.textContent=x.message==='nosec'?'Este navegador não permite abrir o conteúdo. Use o Chrome, Edge, Safari ou Firefox atualizados, pelo link seguro (https).':(x.message==='bad'?'Usuário ou senha incorretos.':'Não foi possível abrir. Tente novamente.');
  b.disabled=false;b.textContent='Entrar';
 }
});
})();
</script></body></html>
